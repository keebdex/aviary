[project]
name = "aviary"
version = "0.1.0"
description = "Crawls forum interest checks and group buys into a review queue, syncs artisan catalogs and reference color palettes, and keeps catalog images in Cloudflare for Keebdex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "supabase>=2.34.1",
]

[project.scripts]
lorikeet = "aviary.lorikeet.__main__:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
]
