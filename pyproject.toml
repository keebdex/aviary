[project]
name = "aviary"
version = "0.1.0"
description = "Crawls forum interest checks and group buys into a review queue, syncs artisan catalogs and reference color palettes, and keeps catalog images in Cloudflare for Keebdex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.44.6",
    "google-auth>=2.62.2",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "python-slugify>=9.2.0",
    "requests>=2.34.2",
    "supabase>=2.34.1",
]

[project.scripts]
bowerbird = "aviary.bowerbird.__main__:main"
lorikeet = "aviary.lorikeet.__main__:main"
magpie = "aviary.magpie.__main__:main"
pelican = "aviary.pelican.__main__:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
