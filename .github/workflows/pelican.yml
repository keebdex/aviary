name: pelican

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [sync, restore, prune, backup, database]
      dry-run:
        description: Read everything and log what would change, without changing it
        type: boolean
        default: true
      force:
        description: Go past the safety ratio (restore --force, backup --force-trash)
        type: boolean
        default: false
  # Scheduled runs write (UTC), off the hour, since GitHub starts schedules
  # hours late and latest on the hour:
  # - sync then restore daily at 01:30, for keyset, kit, and variant images
  #   from the app (bowerbird uploads colorway images itself)
  # - backup and the database dump daily at 03:30, after the night's sync
  # - prune at 04:30 on the 1st and the 15th
  schedule:
    - cron: '30 1 * * *'
    - cron: '30 3 * * *'
    - cron: '30 4 1,15 * *'

concurrency:
  group: pelican-${{ inputs.job || github.event.schedule }}
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  CF_IMAGES_ACCOUNT_ID: ${{ secrets.CF_IMAGES_ACCOUNT_ID }}
  CF_IMAGES_API_KEY: ${{ secrets.CF_IMAGES_API_KEY }}
  CF_IMAGES_ACCOUNT_HASH: ${{ secrets.CF_IMAGES_ACCOUNT_HASH }}
  # User token with Images read access: account tokens can't download the
  # originals of images Cloudflare named (Keebdex app uploads)
  CF_IMAGES_READ_TOKEN: ${{ secrets.CF_IMAGES_READ_TOKEN }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  # Read-only: backup reads the bucket's lock rules to know which backups may
  # move to the trash. Without it the trash is skipped.
  R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}

jobs:
  images:
    if: inputs.job != 'database'
    runs-on: ubuntu-latest
    # backup's first runs copy tens of thousands of images; an interrupted
    # run resumes where it stopped
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Run pelican ${{ inputs.job || 'on schedule' }}
        env:
          SCHEDULE: ${{ github.event.schedule }}
          JOB: ${{ inputs.job }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          FORCE_RESTORE: ${{ inputs.force && inputs.job == 'restore' && '--force' || '' }}
          FORCE_TRASH: ${{ inputs.force && inputs.job == 'backup' && '--force-trash' || '' }}
        run: |
          case "$SCHEDULE" in
            '30 1 * * *') jobs='sync restore' ;;
            '30 3 * * *') jobs='backup' ;;
            '30 4 1,15 * *') jobs='prune' ;;
            *) jobs="$JOB" ;;
          esac
          for job in $jobs; do
            echo "::group::pelican $job"
            uv run pelican "$job" $DRY_RUN $FORCE_RESTORE $FORCE_TRASH
            echo "::endgroup::"
          done

  # By hand, or with the scheduled backup
  database:
    if: inputs.job == 'database' || github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest
    env:
      # Session pooler URL: GitHub runners have no IPv6 for the direct host
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # pg_dump must be at least the server's major version
      PG_VERSION: 17
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects some of the integrity headers newer AWS CLIs send by default
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Install pg_dump
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-$PG_VERSION"

      - name: Dump database
        run: |
          "/usr/lib/postgresql/$PG_VERSION/bin/pg_dump" "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges --file=keebdex.dump
          ls -lh keebdex.dump

      # Daily dumps expire through an R2 lifecycle rule; the dump of the 1st
      # is also kept under monthly/. A dry run only dumps.
      - name: Upload dump to R2
        if: ${{ !inputs.dry-run }}
        run: |
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          key="db/daily/$(date -u +%F).dump"
          aws s3 cp keebdex.dump "s3://$R2_BUCKET/$key" --endpoint-url "$endpoint"

          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp keebdex.dump "s3://$R2_BUCKET/db/monthly/$(date -u +%Y-%m).dump" \
              --endpoint-url "$endpoint"
          fi
