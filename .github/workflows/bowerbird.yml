name: bowerbird

on:
  workflow_dispatch:
    inputs:
      sources:
        description: Which catalogs to sync
        type: choice
        options: [all, gdoc, scrape]
        default: all
      dry-run:
        description: Log every write and upload without making it
        type: boolean
        default: true
  # Scheduled runs write, twice a day at 20:30 and 08:30 UTC (03:30 and 15:30
  # in Vietnam, UTC+7). GitHub starts
  # schedules hours late, most of all on the hour, when load peaks: two runs
  # 12 hours apart, off the hour, keep the catalog fresher. Images are
  # uploaded by the run itself, so pelican's timing doesn't matter here.
  schedule:
    - cron: '30 8,20 * * *'

concurrency:
  group: bowerbird
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  CF_IMAGES_ACCOUNT_ID: ${{ secrets.CF_IMAGES_ACCOUNT_ID }}
  CF_IMAGES_API_KEY: ${{ secrets.CF_IMAGES_API_KEY }}
  CF_IMAGES_ACCOUNT_HASH: ${{ secrets.CF_IMAGES_ACCOUNT_HASH }}
  GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
  DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      # A maker that fails is logged and skipped; the command still exits 0,
      # so one broken doc never stops the next step.
      - name: Sync makers' Google Docs
        if: inputs.sources != 'scrape'
        run: uv run bowerbird gdoc $DRY_RUN

      - name: Sync maker websites
        if: inputs.sources != 'gdoc'
        run: uv run bowerbird scrape $DRY_RUN
